# Cloudflare config for the PUBLIC SITE (landing page + live demo dashboard).
#
# Not to be confused with server/wrangler.toml.example, which is the community
# API and is deliberately not deployed. This one is for static assets only —
# there is no `main`, so no Worker script runs; Cloudflare just serves the
# directory that `site/build.py` produces.
#
# Cloudflare's Git integration builds and deploys this on every push to the
# production branch, and NEEDS NO DASHBOARD CONFIGURATION: the [build] section
# below runs as part of `npx wrangler deploy`, which is already Cloudflare's
# default deploy command. Everything the deploy needs is described in this file,
# so the repo is self-sufficient and a self-hoster gets the same behaviour.
#
# That matters because `site/dist/` is gitignored — it is derived output, it
# rebuilds in about a second, and committing it would make every content change
# look like a code change. So something has to build it on the runner. This is
# that something.
#
# Python 3 is preinstalled in Cloudflare's build image, so there is no setup
# step to add.

name = "ai-observatory"
compatibility_date = "2026-08-19"

# Runs before every deploy, and before `wrangler dev`. This is what produces
# the directory named under [assets] below.
[build]
command = "python3 site/build.py"

[assets]
directory = "./site/dist"
# The site is a handful of static files with real extensions, so let Cloudflare
# serve them as-is rather than rewriting paths: /demo/ resolves to
# /demo/index.html, and anything genuinely missing gets a 404 instead of being
# silently rewritten to the landing page.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
