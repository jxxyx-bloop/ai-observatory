# Pinned SHAs stop a tag being repointed under us (see the note at the top of
# each workflow). The cost of pinning is that a pin goes stale silently, including
# through a security fix — so something has to watch them. This is that something.
#
# Actions only. The engine has no dependencies by design and CI asserts it, so
# there is no manifest here for any other ecosystem to update.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      # One PR a week rather than four. These move together and are reviewed
      # the same way: read the diff of the action, then take the SHA.
      actions:
        patterns:
          - "*"
