name: deploy site

# Publishes the landing page and the live demo dashboard to Cloudflare Pages.
#
# THE IMPORTANT PROPERTY OF THIS FILE: it cannot break a commit made before the
# Cloudflare account exists. The build always runs, so a broken site fails
# loudly and immediately. The *deploy* runs only when the two secrets are
# present, and skips with an explanatory message when they are not.
#
# So the safe order is: merge this, watch it build-and-skip, then add the
# secrets when you are ready. Nothing is red in between.
# See docs/setup/DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site and the demo dashboard
        run: python3 site/build.py

      - name: The published page must make no external requests
        run: |
          # The dashboard's core promise is zero external requests. A landing
          # page that loads a webfont while advertising that would be a bad
          # look, so it is a build failure rather than a code-review question.
          if grep -qiE '<(script|link|img)[^>]+(src|href)="https?://' site/dist/index.html; then
            echo "::error::site/dist/index.html loads a remote asset"
            grep -inE '<(script|link|img)[^>]+(src|href)="https?://' site/dist/index.html
            exit 1
          fi
          test -s site/dist/demo/index.html || { echo "::error::demo dashboard is empty"; exit 1; }
          test -s site/dist/_headers || { echo "::error::_headers missing"; exit 1; }
          echo "ok — no remote assets, demo rendered, headers present"

      - name: Are the deploy credentials configured?
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — build verified, deploy skipped. This is expected until you follow docs/setup/DEPLOY.md."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    # Only on main, and only once someone has actually set the secrets.
    if: needs.build.outputs.deployable == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/build.py

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=ai-observatory --branch=main
