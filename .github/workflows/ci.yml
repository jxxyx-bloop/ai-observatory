# Third-party actions are pinned to commit SHAs, not tags. A tag is a moving
# pointer that the action's owner can repoint at any time, so `@v4` means
# "whatever that account publishes next" — which is how the 2025 supply-chain
# attacks on popular actions reached the repositories that used them. The
# trailing comment is the human-readable version; the SHA is what runs.
# Dependabot (.github/dependabot.yml) raises a PR when these move.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything. The repository default is currently `read`, so
# this changes no behaviour today — it stops the default from being able to. A
# repository-level setting is one click away from read/write for every scope,
# and this job runs code from any pull request that anyone opens; a workflow
# that needs nothing should say so rather than inherit whatever is set later.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine promises stdlib-only Python 3. Testing the oldest version
        # still shipped by a mainstream distro is what keeps that promise real.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job never pushes, so it has no use for the token —
          # and it runs unreviewed pull-request code.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: No dependencies, by design
        run: |
          test ! -f requirements.txt || (echo "engine must stay dependency-free" && exit 1)
      - name: Run every suite
        run: observatory/tests/run.sh
      - name: Config files must parse
        run: |
          for f in observatory/*.json observatory/collectors/specs/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            echo "ok $f"
          done
      - name: End to end on the demo fixture
        run: |
          cd observatory
          python3 observe.py demo digest report insights
